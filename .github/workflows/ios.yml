name: ios

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publish the "latest" release from main

# .NET for iOS requires the exact Xcode major.minor it was built against, and the runner image
# lags new Xcode releases. Pin the pair and bump them together.
env:
  XCODE_VERSION: '26.2'
  IOS_WORKLOAD_MANIFEST: '26.2.10233/10.0.100'

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install iOS workload (pinned to match Xcode)
        run: |
          dotnet workload config --update-mode manifests
          echo "{\"microsoft.net.sdk.ios\": \"${IOS_WORKLOAD_MANIFEST}\"}" > "$RUNNER_TEMP/rollback.json"
          cat "$RUNNER_TEMP/rollback.json"
          dotnet workload install ios --from-rollback-file "$RUNNER_TEMP/rollback.json"
          dotnet workload list

      - name: Build libpsl-native.framework
        run: native/build-psl-native-ios.sh

      # Unsigned on purpose: SideStore / AltStore / Sideloadly re-sign with your own Apple ID.
      - name: Build app
        run: dotnet build src/Trenal.iOS -c Release -p:EnableCodeSigning=false

      - name: Package IPA
        run: |
          APP=$(find src/Trenal.iOS/bin/Release -maxdepth 4 -type d -name '*.app' | head -1)
          echo "app: $APP"
          du -sh "$APP"
          ls "$APP/Frameworks" "$APP/Modules"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry trenal.ipa Payload)
          ls -la out/trenal.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: trenal-ipa
          path: out/trenal.ipa

      # A stable URL to open in Safari on the iPad and hand to SideStore.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/trenal.ipa --prerelease --title "trenal (latest main)" \
            --notes "Unsigned build of ${GITHUB_SHA::7}. Install with SideStore, AltStore or Sideloadly."
